{{- $gh := .Values.auth.github }}
{{- if eq .Values.auth.mode "github" }}
{{- if not $gh.existingSecret }}{{ fail "auth.github.existingSecret is required when auth.mode is github" }}{{ end }}
{{- if not $gh.publicUrl }}{{ fail "auth.github.publicUrl is required when auth.mode is github" }}{{ end }}
{{- if not $gh.allowedOrgs }}{{ fail "auth.github.allowedOrgs is required when auth.mode is github" }}{{ end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacboard.fullname" . }}
  labels:
    {{- include "pacboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pacboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pacboard.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pacboard.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pacboard
          image: {{ include "pacboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --auth-mode={{ .Values.auth.mode }}
            - --log-level={{ .Values.logLevel }}
            {{- with .Values.namespaces }}
            - --namespaces={{ join "," . }}
            {{- end }}
            {{- if eq .Values.auth.mode "github" }}
            - --github-url={{ $gh.url }}
            - --allowed-orgs={{ join "," $gh.allowedOrgs }}
            - --public-url={{ $gh.publicUrl }}
            {{- end }}
          {{- if eq .Values.auth.mode "github" }}
          env:
            - name: PACBOARD_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: {{ $gh.existingSecret }}, key: github-client-id}
            - name: PACBOARD_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $gh.existingSecret }}, key: github-client-secret}
            - name: PACBOARD_SESSION_KEY
              valueFrom:
                secretKeyRef: {name: {{ $gh.existingSecret }}, key: session-key}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "pacboard.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
