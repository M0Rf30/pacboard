{{- if .Values.rbac.create }}
# Read-only. Pods are not readable on purpose (their specs can carry environment values): only their logs are.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pacboard.fullname" . }}
  labels:
    {{- include "pacboard.labels" . | nindent 4 }}
rules:
  - apiGroups: ["pipelinesascode.tekton.dev"]
    resources: ["repositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns", "pipelines"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pacboard.fullname" . }}
  labels:
    {{- include "pacboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pacboard.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pacboard.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
