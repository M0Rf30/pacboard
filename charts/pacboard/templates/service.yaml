apiVersion: v1
kind: Service
metadata:
  name: {{ include "pacboard.fullname" . }}
  labels:
    {{- include "pacboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pacboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
